<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Masar Wolt</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#050b14;
  color:#f5f7fb;
}

.wrap{
  width:min(94%,600px);
  margin:auto;
  padding:28px 0 50px;
}

.header{
  text-align:center;
  margin-bottom:24px;
}

.logo{
  width:72px;
  height:72px;
  margin:auto;
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  background:linear-gradient(145deg,#16b9ff,#167cff);
  box-shadow:0 12px 35px rgba(22,153,255,.25);
}

h1{
  margin:12px 0 5px;
  font-size:30px;
}

.sub{
  color:#8e9bb0;
  font-size:15px;
}

.card{
  background:#0d1a2a;
  border:1px solid #203650;
  border-radius:24px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

label{
  display:block;
  margin-bottom:8px;
  font-size:15px;
  color:#aab7c9;
}

input{
  width:100%;
  min-height:58px;
  border:1px solid #29425e;
  border-radius:16px;
  background:#07111f;
  color:white;
  padding:0 16px;
  font-size:20px;
  outline:none;
  margin-bottom:18px;
}

input:focus{
  border-color:#16b9ff;
}

button{
  width:100%;
  min-height:58px;
  border:0;
  border-radius:17px;
  font-size:19px;
  font-weight:700;
  color:white;
  background:linear-gradient(135deg,#16b9ff,#176cff);
  cursor:pointer;
}

.result{
  display:none;
  margin-top:18px;
}

.status{
  text-align:center;
  padding:18px;
  border-radius:18px;
  font-size:24px;
  font-weight:800;
  margin-bottom:15px;
}

.good{
  background:rgba(32,223,145,.13);
  border:1px solid #20df91;
  color:#43efa8;
}

.bad{
  background:rgba(255,83,92,.13);
  border:1px solid #ff535c;
  color:#ff737b;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#07111f;
  border:1px solid #203650;
  border-radius:17px;
  padding:15px 8px;
  text-align:center;
}

.stat span{
  display:block;
  color:#8e9bb0;
  font-size:13px;
  margin-bottom:6px;
}

.stat strong{
  font-size:21px;
}

.settings{
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid #203650;
}

.settings input{
  margin:8px 0 0;
}

.example{
  margin-top:15px;
  color:#8e9bb0;
  text-align:center;
  line-height:1.7;
  font-size:14px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">
    <div class="logo">🛵</div>
    <h1>Masar Wolt</h1>
    <div class="sub">حاسبة سريعة لمعرفة قيمة الطلب</div>
  </div>

  <div class="card">

    <label for="price">💰 سعر الطلب بالشيقل</label>
    <input
      id="price"
      type="number"
      inputmode="decimal"
      step="0.1"
      placeholder="مثال: 15"
    >

    <label for="distance">📍 مسافة الطلب بالكيلومتر</label>
    <input
      id="distance"
      type="number"
      inputmode="decimal"
      step="0.1"
      placeholder="مثال: 1.9"
    >

    <button onclick="calculate()">احسب الطلب</button>

    <div id="result" class="result">

      <div id="status" class="status"></div>

      <div class="stats">

        <div class="stat">
          <span>سعر الطلب</span>
          <strong id="showPrice">—</strong>
        </div>

        <div class="stat">
          <span>المسافة</span>
          <strong id="showDistance">—</strong>
        </div>

        <div class="stat">
          <span>شيقل لكل كم</span>
          <strong id="perKm">—</strong>
        </div>

        <div class="stat">
          <span>الحد المطلوب</span>
          <strong id="showLimit">—</strong>
        </div>

      </div>
    </div>

  </div>

  <div class="card">
    <div class="settings">
      <label for="limit">⚙️ أقل سعر مقبول لكل كيلومتر</label>

      <input
        id="limit"
        type="number"
        inputmode="decimal"
        step="0.1"
        value="7"
      >

      <div class="example">
        مثال: طلب سعره 15 ₪ ومسافته 1.9 كم<br>
        = حوالي 7.89 ₪ لكل كيلومتر
      </div>
    </div>
  </div>

</div>

<script>
function calculate(){

  const price =
    parseFloat(document.getElementById("price").value);

  const distance =
    parseFloat(document.getElementById("distance").value);

  const limit =
    parseFloat(document.getElementById("limit").value) || 7;

  if(
    !Number.isFinite(price) ||
    !Number.isFinite(distance) ||
    price <= 0 ||
    distance <= 0
  ){
    alert("أدخل سعر الطلب والمسافة بشكل صحيح");
    return;
  }

  const value = price / distance;

  document.getElementById("showPrice").textContent =
    price.toFixed(2) + " ₪";

  document.getElementById("showDistance").textContent =
    distance.toFixed(1) + " كم";

  document.getElementById("perKm").textContent =
    value.toFixed(2) + " ₪";

  document.getElementById("showLimit").textContent =
    limit.toFixed(2) + " ₪";

  const status = document.getElementById("status");

  if(value >= limit){
    status.className = "status good";
    status.textContent = "🟢 طلب مناسب";
  }else{
    status.className = "status bad";
    status.textContent = "🔴 طلب غير مناسب";
  }

  document.getElementById("result").style.display = "block";
}

document.addEventListener("keydown",function(e){
  if(e.key === "Enter"){
    calculate();
  }
});
</script>

</body>
</html>
