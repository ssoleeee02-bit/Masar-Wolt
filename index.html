<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Masar Wolt</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#050b14;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.app{
  width:92%;
  max-width:430px;
  margin:auto;
  padding:30px 0;
}

.header{
  text-align:center;
  margin-bottom:22px;
}

.logo{
  font-size:36px;
  margin-bottom:5px;
}

h1{
  margin:0;
  font-size:27px;
}

.wolt{
  color:#22b8ff;
}

.subtitle{
  margin-top:6px;
  color:#8996a8;
  font-size:14px;
}

.card{
  background:#0d1a2a;
  border:1px solid #203650;
  border-radius:20px;
  padding:18px;
}

label{
  display:block;
  color:#aab5c5;
  font-size:14px;
  margin-bottom:7px;
}

input{
  width:100%;
  height:52px;
  background:#07111f;
  color:#fff;
  border:1px solid #29445f;
  border-radius:14px;
  padding:0 14px;
  font-size:19px;
  outline:none;
  margin-bottom:15px;
}

input:focus{
  border-color:#22b8ff;
}

button{
  width:100%;
  height:52px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#1677ff,#22c1f6);
  color:#fff;
  font-size:18px;
  font-weight:700;
}

.result{
  display:none;
  margin-top:16px;
}

.answer{
  text-align:center;
  padding:15px;
  border-radius:15px;
  font-size:23px;
  font-weight:800;
}

.good{
  background:rgba(30,215,140,.12);
  border:1px solid #20d991;
  color:#3ee8a4;
}

.bad{
  background:rgba(255,75,85,.12);
  border:1px solid #ff4b55;
  color:#ff6b73;
}

.details{
  margin-top:10px;
  text-align:center;
  color:#aab5c5;
  font-size:15px;
}

.rate{
  color:#fff;
  font-size:20px;
  font-weight:700;
}

.limit{
  text-align:center;
  color:#69788d;
  font-size:12px;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">🛵</div>
    <h1>Masar <span class="wolt">Wolt</span></h1>
    <div class="subtitle">هل الطلب يستاهل؟</div>
  </div>

  <div class="card">

    <label>💰 سعر الطلب (₪)</label>
    <input
      id="price"
      type="number"
      inputmode="decimal"
      step="0.1"
      placeholder="مثال: 16"
    >

    <label>📍 المسافة (كم)</label>
    <input
      id="distance"
      type="number"
      inputmode="decimal"
      step="0.1"
      placeholder="مثال: 2.2"
    >

    <button onclick="calculate()">احسب</button>

    <div id="result" class="result">

      <div id="answer" class="answer"></div>

      <div class="details">
        قيمة الكيلومتر:
        <span id="rate" class="rate"></span>
      </div>

    </div>

    <div class="limit">
      الحد المعتمد: 7 ₪ لكل كم
    </div>

  </div>

</div>

<script>
function calculate(){

  const price =
    parseFloat(document.getElementById("price").value);

  const distance =
    parseFloat(document.getElementById("distance").value);

  if(
    !Number.isFinite(price) ||
    !Number.isFinite(distance) ||
    price <= 0 ||
    distance <= 0
  ){
    alert("أدخل سعر الطلب والمسافة");
    return;
  }

  const limit = 7;
  const value = price / distance;

  const answer = document.getElementById("answer");

  document.getElementById("rate").textContent =
    value.toFixed(2) + " ₪/كم";

  if(value >= limit){
    answer.className = "answer good";
    answer.textContent = "🟢 مناسب";
  }else{
    answer.className = "answer bad";
    answer.textContent = "🔴 غير مناسب";
  }

  document.getElementById("result").style.display = "block";
}
</script>

</body>
</html>
